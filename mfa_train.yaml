# Montreal Forced Aligner training stages for Kuyil: MFA's classic monophone -> triphone -> LDA -> speaker-adapted
# recipe, without its pronunciation-probability rounds (each of our words has one pronunciation).
#   mfa train CORPUS DICT MODEL.zip --config_path mfa_train.yaml --output_directory ALIGNED -j 8 --clean
beam: 10
retry_beam: 40
training:
  - monophone:
      num_iterations: 40
      max_gaussians: 1000
      subset: 2000
  - triphone:
      num_iterations: 35
      num_leaves: 2000
      max_gaussians: 10000
      cluster_threshold: 100
      subset: 5000
      boost_silence: 1.25
      power: 0.25
  - lda:
      num_iterations: 35
      num_leaves: 2500
      max_gaussians: 15000
      subset: 10000
  - sat:
      num_iterations: 35
      num_leaves: 2500
      max_gaussians: 15000
      power: 0.2
      silence_weight: 0.0
      fmllr_update_type: diag
      subset: 10000
